<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U4 - galaxy</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="u4_canvas"></canvas>
    <script type="module">
        import init, { start } from './u4.js';

        async function run() {
            try {
                await init();
                console.log('U4 WASM initialized');
                await start('u4_canvas');
            } catch (e) {
                console.error('U4 load error:', e);
            }
        }

        run();
    </script>
</body>
</html>
